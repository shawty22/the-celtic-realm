<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#0d0a07"/>
  <rect width="512" height="512" rx="80" fill="url(#border)"/>
  <!-- Celtic border pattern -->
  <rect x="20" y="20" width="472" height="472" rx="60" fill="none" stroke="#c8a96e" stroke-width="8" opacity="0.6"/>
  <rect x="36" y="36" width="440" height="440" rx="48" fill="none" stroke="#c8a96e" stroke-width="3" opacity="0.3"/>
  <!-- Triskelion / spiral motif -->
  <g transform="translate(256,256)" fill="none" stroke="#c8a96e" stroke-width="12" stroke-linecap="round">
    <path d="M 0 0 Q -80 -40 -60 -110 Q -30 -160 30 -140 Q 90 -110 70 -40 Q 50 20 0 0" opacity="0.9"/>
    <path d="M 0 0 Q 80 -40 110 30 Q 130 90 70 120 Q 10 140 -20 80 Q -50 20 0 0" opacity="0.9"/>
    <path d="M 0 0 Q -40 80 -100 70 Q -160 50 -140 -20 Q -110 -80 -40 -60 Q 20 -40 0 0" opacity="0.9"/>
  </g>
  <!-- Central dot -->
  <circle cx="256" cy="256" r="14" fill="#c8a96e"/>
  <!-- Title text -->
  <text x="256" y="420" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#c8a96e" letter-spacing="2" opacity="0.85">THE CELTIC</text>
  <text x="256" y="458" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#c8a96e" letter-spacing="2" opacity="0.85">REALM</text>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1309"/>
      <stop offset="100%" stop-color="#0d0a07"/>
    </linearGradient>
  </defs>
</svg>
