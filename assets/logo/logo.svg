<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Celtic Realm logo — three interlocking spirals in gold, crimson, and forest green on a dark ground">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1a1610"/>
      <stop offset="100%" stop-color="#0c0a07"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bg)" stroke="#3a2f1f" stroke-width="2"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#6b4f2a" stroke-width="1" opacity="0.5"/>

  <!-- three spirals, one per mythology cycle, rotated 120° apart around the centre -->
  <g stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M100 100 C 100 70, 130 60, 140 85 C 148 105, 130 120, 112 112" stroke="#d9b25a" transform="rotate(0 100 100)"/>
    <path d="M100 100 C 100 70, 130 60, 140 85 C 148 105, 130 120, 112 112" stroke="#a8382c" transform="rotate(120 100 100)"/>
    <path d="M100 100 C 100 70, 130 60, 140 85 C 148 105, 130 120, 112 112" stroke="#3f6b46" transform="rotate(240 100 100)"/>
  </g>
  <circle cx="100" cy="100" r="6" fill="#e8dcc0"/>
</svg>
