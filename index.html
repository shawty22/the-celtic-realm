<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Otherworld Hearth — The Celtic Realm</title>
    <meta name="description" content="Five realms of the Irish Otherworld — an interactive animated painting. Chapter I of The Celtic Realm." />
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <div id="app">

      <!-- ═══ Three-layer canvas stack ═══════════════════════════════════ -->

      <!-- Layer 0: full-screen background image / painted placeholder -->
      <canvas id="bg" aria-hidden="true"></canvas>

      <!-- Layer 1: WebGL transparent atmosphere (mist, glow, particles, shafts) -->
      <canvas id="atm" aria-hidden="true"></canvas>

      <!-- Layer 2: 2D creatures + click targets -->
      <canvas id="world" aria-label="The Otherworld — click a creature to meet it"></canvas>

      <!-- ═══ CSS overlays ════════════════════════════════════════════════ -->
      <div class="overlay grain" aria-hidden="true"></div>
      <div class="overlay vignette" aria-hidden="true"></div>

      <!-- ═══ Realm navigation ════════════════════════════════════════════ -->
      <nav id="realm-nav" aria-label="Realms of the Otherworld"></nav>

      <!-- ═══ Title plate ════════════════════════════════════════════════ -->
      <header class="plate" id="title-plate" aria-hidden="true">
        <h1>The Otherworld Hearth</h1>
        <p class="sub">The Celtic Realm · Chapter I</p>
      </header>

      <!-- ═══ Bottom dock ════════════════════════════════════════════════ -->
      <div class="dock" role="toolbar" aria-label="Companion panels">
        <button class="dock-btn" data-panel="journal" title="World Journal">
          <span class="dock-glyph">❦</span><span class="dock-label">Journal</span>
        </button>
        <button class="dock-btn" data-panel="glossary" title="Mythology Glossary">
          <span class="dock-glyph">✦</span><span class="dock-label">Glossary</span>
        </button>
        <button class="dock-btn" data-panel="tain" title="The Táin · Prelude">
          <span class="dock-glyph">⚔</span><span class="dock-label">Táin</span>
        </button>
        <button class="dock-btn" data-panel="about" title="About the Hearth">
          <span class="dock-glyph">☘</span><span class="dock-label">About</span>
        </button>
      </div>

      <!-- ═══ Creature card (right slide) ════════════════════════════════ -->
      <aside class="panel card-panel" id="creature-card" hidden></aside>

      <!-- ═══ Slide-over panels (left) ════════════════════════════════════ -->
      <aside class="panel slide-panel" id="slide-panel" hidden></aside>

      <!-- ═══ Táin story bar (bottom, above nav) ════════════════════════════ -->
      <div class="story-bar" id="story-bar" hidden></div>

      <!-- ═══ Hint ════════════════════════════════════════════════════════ -->
      <p class="hint" id="hint">click a creature to meet it · use the realm tabs to wander</p>

    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
